name: 'finance'
version: '1.0.0'
require-dbt-version: [">=1.9.0"]
profile: 'default'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  finance:
    marts:
      +materialized: table
      +schema: finance
      +access: protected
