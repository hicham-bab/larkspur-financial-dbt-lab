version: 2

models:
  - name: metricflow_time_spine
    description: "Day-grain MetricFlow time spine, 2007-01-01 to 2026-12-31."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "Calendar date."
        granularity: day
        data_tests: [unique, not_null]
