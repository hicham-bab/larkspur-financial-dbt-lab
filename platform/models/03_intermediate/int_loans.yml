version: 2

models:
  - name: int_loans
    description: "Consumer loans with percent strings, Mon-YY dates and the 'NA' sentinel parsed and the century bug fixed. Identity columns never entered the vault."
    config:
      meta:
        owner: lending-data-team
        domain: lending
        pii_contains: false
    columns:
      - name: loan_id
        data_tests:
          - unique
          - not_null
      - name: issue_date
        data_tests:
          - not_null
